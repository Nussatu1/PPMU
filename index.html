<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- Filament-style amber diamond SVG favicon -->
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%23fbbf24'/%3E%3Cstop offset='100%25' stop-color='%23d97706'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M12 2L3 7V17L12 22L21 17V7L12 2Z' fill='url(%23g)'/%3E%3C/svg%3E" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- color-scheme: native scrollbar dan form controls ikut tema aktif -->
  <meta name="color-scheme" content="light dark" />
  <title>My Tafrih</title>
  <!-- FOUC Prevention: inject .dark ke <html> SEBELUM React mount dan paint pertama.
         Logika IDENTIK dengan ThemeContext init: hanya 'dark' jika nilai tersimpan 'dark'. -->
  <script>
    try {
      if (localStorage.getItem('filament_theme') === 'dark') {
        document.documentElement.classList.add('dark');
      }
      if (localStorage.getItem('filament_accent_color') === 'green') {
        document.documentElement.classList.add('theme-green');
      }
    } catch (e) { }
  </script>
  <!-- Inter font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet" />
</head>

<body class="antialiased selection:bg-amber-500/20">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
